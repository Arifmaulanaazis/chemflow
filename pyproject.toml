[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chemflow"
version = "0.1.0"
description = "Pipeline CLI dan library: preparasi ligan/reseptor, ADMET, docking AutoDock Vina, merge kompleks, PCA/HCA/heatmap kemometrik."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "rdkit>=2023.9.1",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pubchempy>=1.0.4",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "tqdm>=4.66.0",
]
authors = [
    { name = "Arif Maulana Azis", email = "titandigitalsoft@gmail.com" },
]

[project.optional-dependencies]
test = ["pytest>=7.4.0"]

[project.urls]
Homepage = "https://github.com/Arifmaulanaazis"

[project.scripts]
chemflow = "chemflow.cli:main"

[tool.setuptools.packages.find]
include = ["chemflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
